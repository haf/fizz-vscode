[project]
name = "fizz-lsp"
version = "0.0.1"
description = "Fizz language server"
requires-python = ">=3.9"
dependencies = [
  "pygls<2",
  "antlr4-python3-runtime>=4.13.2",
]

[project.scripts]
fizz-lsp = "fizz_lsp.__main__:main"

[tool.pytest.ini_options]
addopts = "-q"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]
